# electron-builder 配置：全平台（Windows / macOS / Linux）× 全架构（x64 / arm64）
# 启动器读 out/main/index.js（electron-vite 的产物）；CI 按 --win/--mac/--linux + --x64/--arm64 分别打包。
appId: com.integem.friday.work
productName: Friday Work
copyright: Friday Desktop Work

directories:
  output: dist
  buildResources: build

files:
  - out/**/*
  - resources/**/*
  - package.json
  - '!**/*.map'
  - '!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}/**'
  - '!**/node_modules/**/*.d.ts'

# 原生模块保留在 asar 外面（ssh2 可选依赖 cpu-features 是 .node）
asar: true
asarUnpack:
  - '**/*.node'

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Friday Work
  deleteAppDataOnUninstall: false

win:
  target: [nsis, zip]
  artifactName: Friday-Work-${version}-win-${arch}.${ext}

mac:
  target: [dmg, zip]
  category: public.app-category.developer-tools
  identity: null # CI 上无签名证书，显式跳过
  artifactName: Friday-Work-${version}-mac-${arch}.${ext}

linux:
  target: [AppImage, deb]
  maintainer: integemjack <jack.wang@integem.com>
  category: Utility
  artifactName: Friday-Work-${version}-linux-${arch}.${ext}
