name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (electron-vite)
        run: npx electron-vite build

      - name: Resolve platform flag
        id: plat
        run: |
          case "${{ matrix.os }}" in
            windows-latest) flag="--win" ;;
            macos-latest)   flag="--mac" ;;
            ubuntu-latest)  flag="--linux" ;;
          esac
          echo "flag=$flag" >> "$GITHUB_OUTPUT"

      - name: Package (electron-builder)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # 构建提交进客户端（__APP_COMMIT__）：自动更新用它判断 rolling 通道的新构建
          GIT_COMMIT: ${{ github.sha }}
        run: npx electron-builder ${{ steps.plat.outputs.flag }} --${{ matrix.arch }} --publish never

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          find dist -maxdepth 1 -type f \( -name '*.exe' -o -name '*.zip' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \) -exec cp {} artifacts/ \;
          ls -la artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.os }}-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Resolve release tag
        id: rel
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "title=Friday Work $GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=rolling" >> "$GITHUB_OUTPUT"
            echo "title=Friday Work Rolling（main 最新构建）" >> "$GITHUB_OUTPUT"
          fi
          ls -la artifacts

      - name: Generate update manifest (latest.json)
        env:
          TAG: ${{ steps.rel.outputs.tag }}
          REPO_SLUG: ${{ github.repository }}
          GIT_COMMIT: ${{ github.sha }}
        run: node scripts/make-update-manifest.cjs artifacts "$TAG" > artifacts/latest.json

      - name: Publish to GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.title }}
          commitish: main
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          body: |
            全自动构建（GitHub Actions）：Windows / macOS / Linux × x64 / arm64。

            - **Windows**：NSIS 安装包 + 便携 zip（未签名）
            - **macOS**：dmg + app zip（未签名；首次打开：右键 → 打开，或在 系统设置 → 隐私与安全性 里放行）
            - **Linux**：AppImage + deb

            提交：${{ github.sha }}

            客户端内「设置 → 客户端更新」可检查并安装新版（读这份 Release 里的 latest.json）。
          artifacts: 'artifacts/*'
