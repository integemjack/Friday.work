name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v[0-9]*']   # 只认 v0.5.x 这类版本 tag；voice-v*（引擎）不能触发客户端发布
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 自动升版：推 main 时如果 rolling 上已有“同版本号、不同提交”的构建，
  # 说明这次推送忘了按规则人工升 package.json（历史上有会话忘升，导致
  # 新构建仍叫旧版本号，客户端比对版本号也误判“已是最新”）。
  # 这里自动把 patch +1、写回 main 再构建，不依赖人工；
  # 人工已升版（rolling 版本 ≠ package.json 版本）或同一提交重建则不动。
  bump-version:
    name: Auto-bump patch version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bump patch version if needed
        id: bump
        run: |
          set -euo pipefail
          CUR=$(node -p "require('./package.json').version")
          FINAL="$CUR"
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ] \
            && curl -fsSL "https://github.com/${{ github.repository }}/releases/download/rolling/latest.json" -o prev.json 2>/dev/null; then
            PREV_VER=$(node -p "JSON.parse(require('fs').readFileSync('prev.json','utf8')).version")
            PREV_COMMIT=$(node -p "(JSON.parse(require('fs').readFileSync('prev.json','utf8')).commit)||''")
            if [ "$PREV_VER" = "$CUR" ] && [ -n "$PREV_COMMIT" ] && [ "$PREV_COMMIT" != "${{ github.sha }}" ]; then
              NEW=$(node -e "const s='$CUR'.split('.');s[2]=Number(s[2])+1;console.log(s.join('.'))")
              node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version='$NEW';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add package.json
              git commit -m "chore(release): bump $CUR -> $NEW (CI 自动升版，源提交 ${{ github.sha }}) [skip ci]"
              git push origin HEAD:main
              FINAL="$NEW"
              echo "自动升版 $CUR -> $NEW"
            else
              echo "不升版：rolling=$PREV_VER/$PREV_COMMIT，本次=$CUR/${{ github.sha }}"
            fi
          else
            echo "非 main push 或 rolling 不存在，不升版"
          fi
          echo "version=$FINAL" >> "$GITHUB_OUTPUT"

  build:
    needs: bump-version
    name: ${{ matrix.os }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4

      # 用 bump-version 定稿的版本号构建（自动升版时与 main 回写一致）
      - name: Apply release version
        run: node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version='${{ needs.bump-version.outputs.version }}';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (electron-vite)
        run: npx electron-vite build

      - name: Resolve platform flag
        id: plat
        run: |
          case "${{ matrix.os }}" in
            windows-latest) flag="--win" ;;
            macos-latest)   flag="--mac" ;;
            ubuntu-latest)  flag="--linux" ;;
          esac
          echo "flag=$flag" >> "$GITHUB_OUTPUT"

      - name: Package (electron-builder)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # 构建提交进客户端（__APP_COMMIT__）：自动更新用它判断 rolling 通道的新构建
          GIT_COMMIT: ${{ github.sha }}
        run: npx electron-builder ${{ steps.plat.outputs.flag }} --${{ matrix.arch }} --publish never

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          find dist -maxdepth 1 -type f \( -name '*.exe' -o -name '*.zip' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \) -exec cp {} artifacts/ \;
          ls -la artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.os }}-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error

  release:
    needs: [bump-version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Apply release version
        run: node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version='${{ needs.bump-version.outputs.version }}';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Resolve release tag
        id: rel
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "title=Friday Work $GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=rolling" >> "$GITHUB_OUTPUT"
            echo "title=Friday Work Rolling（main 最新构建）" >> "$GITHUB_OUTPUT"
          fi
          ls -la artifacts

      - name: Generate update manifest (latest.json)
        env:
          TAG: ${{ steps.rel.outputs.tag }}
          REPO_SLUG: ${{ github.repository }}
          GIT_COMMIT: ${{ github.sha }}
        run: node scripts/make-update-manifest.cjs artifacts "$TAG" > artifacts/latest.json

      # rolling 是同一个 tag 反复覆盖，旧版本的产物会一直堆积（曾积到 90+ 个文件，
      # 从 0.1.0 到最新版混在一起，容易下到与 package.json 不一致的旧包）。
      # 发布前把不属于当前版本的旧产物清掉，rolling 页面永远只剩最新一套。
      - name: Prune stale rolling assets
        if: steps.rel.outputs.tag == 'rolling'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "保留版本：$VERSION"
          gh api "repos/${{ github.repository }}/releases/tags/rolling" \
            --jq '.assets[] | [.id, .name] | @tsv' \
          | while IFS=$'\t' read -r id name; do
              case "$name" in
                "Friday-Work-$VERSION-"*|latest.json|SHA256SUMS.txt)
                  echo "保留 $name" ;;
                *)
                  echo "删除 $name"
                  gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$id" ;;
              esac
            done

      # 直连下载大安装包（~112MB）经常中断，NSIS 对不完整的文件会报
      # “Installer integrity check has failed”直接无法安装。
      # 附一份校验和，下载后 sha256sum -c 即可确认文件完整。
      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish to GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.title }}
          commitish: main
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          body: |
            全自动构建（GitHub Actions）：Windows / macOS / Linux × x64 / arm64。rolling 只保留最新版本的一套产物。

            - **Windows**：NSIS 安装包 + 便携 zip（未签名）。普通 PC 选 win-x64，Windows on ARM 设备选 win-arm64
            - **macOS**：dmg + app zip（未签名；首次打开：右键 → 打开，或在 系统设置 → 隐私与安全性 里放行）
            - **Linux**：AppImage + deb

            **下载与安装注意**（安装器报“NSIS Error / Installer integrity check has failed”＝文件没下完整）：
            - 安装包约 100–155MB，网络不稳时浏览器可能下载中断；失败请重试，或用支持断点续传的方式下载（`curl -L -C - -o 文件名 下载链接`）
            - 下载后对照 **SHA256SUMS.txt** 校验完整性：`sha256sum -c SHA256SUMS.txt`（Windows 可用 `certutil -hashfile 文件 SHA256`）
            - Windows 首次运行若弹“Windows 已保护你的电脑”（SmartScreen）：点 **更多信息 → 仍要运行**

            提交：${{ github.sha }}

            客户端内「设置 → 客户端更新」可检查并安装新版（读这份 Release 里的 latest.json）。
          artifacts: 'artifacts/*'
